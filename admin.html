<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHAAI PDFs · Admin</title>
<link rel="icon" href="logo.jpeg"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
:root{color-scheme:dark;--bg:#0a0a0f;--panel:#15151d;--line:#ffffff18;--text:#f0ede8;--muted:#a19ba3;--accent:#ff6b35;--teal:#00d4aa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#ff6b3520,transparent 32%),radial-gradient(circle at 90% 80%,#00d4aa15,transparent 30%),var(--bg);color:var(--text);font:15px 'Instrument Sans',sans-serif;min-height:100vh}.wrap{width:min(900px,calc(100% - 32px));margin:0 auto;padding:36px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px;font:800 1.2rem Syne}.brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}.link{color:var(--accent);text-decoration:none}.panel,.review{background:#ffffff08;border:1px solid var(--line);border-radius:20px;padding:24px;margin:16px 0;backdrop-filter:blur(18px)}h1,h2{font-family:Syne;margin:0 0 10px}h1{font-size:clamp(1.8rem,5vw,2.6rem)}p{color:var(--muted);line-height:1.6}.field{display:grid;gap:8px;margin:14px 0}input,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#09090e;color:var(--text);font:inherit}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(120deg,#ff6b35,#ff9a5c);color:#1b100b;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#ffffff12;color:var(--text);border:1px solid var(--line)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.status{font-size:.9rem;color:var(--teal);min-height:22px}.review{padding:20px}.review-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stars{color:#ffc845}.review-text{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}.existing{border-left:3px solid var(--teal);padding:10px 13px;background:#00d4aa10;border-radius:0 10px 10px 0;margin:12px 0}.hidden{display:none!important}@media(max-width:560px){.wrap{padding-top:22px}.panel{padding:18px}.top{align-items:flex-start}.top .row{flex-direction:column;align-items:flex-end}}
</style>
</head>
<body><main class="wrap">
<header class="top"><a class="brand link" href="./"><img src="logo.jpeg" alt="">BHAAI PDFs <span style="color:var(--muted);font:500 .8rem 'Instrument Sans'">ADMIN</span></a><a class="link" href="./">← Back to website</a></header>
<section class="panel" id="loginPanel"><h1>Admin login</h1><p>Sign in with the Supabase account you created. Only the authorized admin account can publish replies.</p>
<form id="loginForm"><label class="field">Email<input id="email" type="email" autocomplete="username" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><div class="status" id="loginStatus" role="status"></div></section>
<section id="dashboard" class="hidden"><div class="row"><div><h1>Community replies</h1><p>Write or update your reply below each student's review.</p></div><button class="secondary" id="logoutBtn">Sign out</button></div><div id="reviewList"><p>Loading feedback…</p></div></section>
</main><script src="admin.js"></script></body></html>
